<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QuinnHaven Admin</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        .login-logo {
            text-align: center;
            color: var(--gold);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .login-subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 32px;
            font-size: 14px;
        }
        .btn-block {
            width: 100%;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="login-logo">QuinnHaven Design</div>
        <div class="login-subtitle">Admin Panel Login</div>

        <div id="error-message" class="alert alert-error hidden">
            Invalid username or password
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-input" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                <span>Sign In</span>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');
            const loginBtn = document.getElementById('login-btn');
            
            // Show loading
            loginBtn.innerHTML = '<span class="spinner"></span>';
            loginBtn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    window.location.href = '/admin/dashboard.html';
                } else {
                    errorMsg.textContent = data.message || 'Invalid username or password';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.classList.remove('hidden');
                console.error('Login error:', err);
            } finally {
                loginBtn.innerHTML = '<span>Sign In</span>';
                loginBtn.disabled = false;
            }
        });
        
        // Setup initial auth check - redirect to dashboard if already logged in
        fetch('/api/auth/check')
            .then(res => res.json())
            .then(data => {
                if (data.loggedIn) {
                    window.location.href = '/admin/dashboard.html';
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
